<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1174" width="860" height="1174" role="img" xmlns:c2pa="http://c2pa.org/manifest">
<style>
text{font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:13px;fill:#1f2328}
.m{font-family:Consolas,'Courier New',monospace;font-size:12px}
.b{font-weight:700}.c{text-anchor:middle}.t{font-size:20px;font-weight:700}.s{font-size:12px;fill:#57606a}
.lab{font-size:12px;font-weight:700;fill:#57606a}
.n{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5}
.io{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
.d{fill:#fbefff;stroke:#8250df;stroke-width:1.5}
.ok{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
.no{fill:#ffebe9;stroke:#cf222e;stroke-width:1.5}
.wa{fill:#fff8c5;stroke:#9a6700;stroke-width:1.5}
.tm{fill:#1f2328}
.l{stroke:#57606a;stroke-width:1.6;fill:none}
.loop{fill:none;stroke:#8250df;stroke-width:1.5;stroke-dasharray:7 5}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#57606a"/></marker></defs>
<rect x="0.75" y="0.75" width="858.5" height="1172.5" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="430" y="34" class="c t">Pharmacy System: Program Flow</text>
<rect class="tm" x="280" y="55" width="160" height="38" rx="19"/><text x="360.0" y="79" class="c b" style="fill:#fff">START</text>
<path class="l" d="M360,93V120" marker-end="url(#a)"/>
<polygon class="io" points="238.0,120 518.0,120 482.0,172 202.0,172"/><text x="360" y="139.5" class="c">Input: number of medicines (n)</text><text x="360" y="160.5" class="c">validated: whole number ≥ 1</text>
<path class="l" d="M360,172V200" marker-end="url(#a)"/>
<rect class="n" x="200" y="200" width="320" height="96" rx="8"/><text x="360.0" y="231.0" class="c m">total_revenue = 0.0  # accumulator</text><text x="360.0" y="252.0" class="c m">restock_count = 0   # counter</text><text x="360.0" y="273.0" class="c m">successful_sales = 0, failed_sales = 0</text>
<path class="l" d="M360,296V324" marker-end="url(#a)"/>
<polygon class="d" points="240,324 480,324 512,352 480,380 240,380 208,352"/><text x="360" y="357" class="c m b">for i in range(1, n + 1)</text>
<path class="l" d="M360,380V420" marker-end="url(#a)"/>
<rect class="loop" x="40" y="410" width="780" height="560" rx="14"/>
<text x="56" y="432" class="lab" style="fill:#8250df">LOOP BODY: repeats once per medicine</text>
<polygon class="io" points="238.0,446 518.0,446 482.0,500 202.0,500"/><text x="360" y="466.5" class="c">Input: name, stock, price,</text><text x="360" y="487.5" class="c">quantity sold (all validated)</text>
<path class="l" d="M360,500V528" marker-end="url(#a)"/>
<polygon class="d" points="360,528 475,576 360,624 245,576"/><text x="360" y="580.0" class="c">quantity &gt; stock ?</text>
<path class="l" d="M475,576H520" marker-end="url(#a)"/>
<text x="497" y="566" class="lab" style="text-anchor:middle">Yes</text>
<rect class="no" x="520" y="536" width="280" height="80" rx="8"/><text x="660.0" y="559.0" class="c b">Sale rejected</text><text x="660.0" y="580.0" class="c m">failed_sales += 1</text><text x="660.0" y="601.0" class="c m">remaining = stock</text>
<path class="l" d="M360,624V652" marker-end="url(#a)"/>
<text x="374" y="642" class="lab" style="text-anchor:start">No</text>
<rect class="ok" x="200" y="652" width="320" height="104" rx="8"/><text x="360.0" y="676.5" class="c m">sale_amount = quantity * price</text><text x="360.0" y="697.5" class="c m">total_revenue += sale_amount</text><text x="360.0" y="718.5" class="c m">successful_sales += 1</text><text x="360.0" y="739.5" class="c m">remaining = stock - quantity</text>
<path class="l" d="M660,616V786H360"/>
<path class="l" d="M360,756V810" marker-end="url(#a)"/>
<polygon class="d" points="360,810 475,858 360,906 245,858"/><text x="360" y="862.0" class="c">remaining &lt; 10 ?</text>
<path class="l" d="M475,858H520" marker-end="url(#a)"/>
<text x="497" y="848" class="lab" style="text-anchor:middle">Yes</text>
<rect class="wa" x="520" y="820" width="280" height="76" rx="8"/><text x="660.0" y="841.0" class="c b">WARNING: low stock</text><text x="660.0" y="862.0" class="c m">restock_count += 1</text><text x="660.0" y="883.0" class="c m">restock_list.append(name)</text>
<path class="l" d="M660,896V944H360"/>
<path class="l" d="M360,906V944" marker-end="url(#a)"/><path class="l" d="M360,944H80V352H206"/><path class="l" d="M80,352H206" marker-end="url(#a)"/>
<text x="220" y="936" class="lab" style="text-anchor:start">No: next medicine</text>
<path class="l" d="M512,352H845V1040H520"/><path class="l" d="M845,1040H520" marker-end="url(#a)"/>
<text x="700" y="344" class="lab" style="text-anchor:middle">all medicines processed</text>
<rect class="n" x="200" y="990" width="320" height="100" rx="8"/><text x="360.0" y="1012.5" class="c b">FINAL REPORT</text><text x="360.0" y="1033.5" class="c">total processed, successful &amp; rejected sales</text><text x="360.0" y="1054.5" class="c">total revenue (Rs.)</text><text x="360.0" y="1075.5" class="c">medicines requiring restock + list</text>
<path class="l" d="M360,1090V1116" marker-end="url(#a)"/>
<rect class="tm" x="280" y="1116" width="160" height="38" rx="19"/><text x="360.0" y="1140" class="c b" style="fill:#fff">END</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
