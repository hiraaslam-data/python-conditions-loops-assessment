<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 902" width="820" height="902" role="img" xmlns:c2pa="http://c2pa.org/manifest">
<style>
text{font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:13px;fill:#1f2328}
.m{font-family:Consolas,'Courier New',monospace;font-size:12px}
.b{font-weight:700}.c{text-anchor:middle}.t{font-size:20px;font-weight:700}.s{font-size:12px;fill:#57606a}
.lab{font-size:12px;font-weight:700;fill:#57606a}
.n{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5}
.io{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
.d{fill:#fbefff;stroke:#8250df;stroke-width:1.5}
.ok{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
.no{fill:#ffebe9;stroke:#cf222e;stroke-width:1.5}
.wa{fill:#fff8c5;stroke:#9a6700;stroke-width:1.5}
.tm{fill:#1f2328}
.l{stroke:#57606a;stroke-width:1.6;fill:none}
.loop{fill:none;stroke:#8250df;stroke-width:1.5;stroke-dasharray:7 5}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#57606a"/></marker></defs>
<rect x="0.75" y="0.75" width="818.5" height="900.5" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="410" y="34" class="c t">Scholarship Eligibility: Program Flow</text>
<rect class="tm" x="330" y="55" width="160" height="38" rx="19"/><text x="410.0" y="79" class="c b" style="fill:#fff">START</text>
<path class="l" d="M410,93V120" marker-end="url(#a)"/>
<polygon class="io" points="288.0,120 568.0,120 532.0,172 252.0,172"/><text x="410" y="139.5" class="c">Input: name, marks,</text><text x="410" y="160.5" class="c">attendance, family income</text>
<path class="l" d="M410,172V200" marker-end="url(#a)"/>
<polygon class="d" points="410,200 535,248 410,296 285,248"/><text x="410" y="252.0" class="c">All inputs valid?</text>
<path class="l" d="M285,248H150V146H258"/><path class="l" d="M150,146H262" marker-end="url(#a)"/>
<text x="210" y="238" class="lab" style="text-anchor:middle">No: ask again</text>
<path class="l" d="M410,296V330" marker-end="url(#a)"/>
<text x="424" y="318" class="lab" style="text-anchor:start">Yes</text>
<rect class="n" x="250" y="330" width="320" height="112" rx="8"/><text x="410.0" y="358.5" class="c b">Check each criterion</text><text x="410.0" y="379.5" class="c m">marks &lt; 80  →  add reason</text><text x="410.0" y="400.5" class="c m">attendance &lt; 85  →  add reason</text><text x="410.0" y="421.5" class="c m">income &gt; 50,000  →  add reason</text>
<path class="l" d="M410,442V474" marker-end="url(#a)"/>
<polygon class="d" points="410,474 545,522 410,570 275,522"/><text x="410" y="526.0" class="c">Any reasons collected?</text>
<path class="l" d="M545,522H600" marker-end="url(#a)"/>
<text x="572" y="512" class="lab" style="text-anchor:middle">Yes</text>
<rect class="no" x="600" y="490" width="180" height="64" rx="8"/><text x="690.0" y="515.5" class="c b">NOT ELIGIBLE</text><text x="690.0" y="536.5" class="c">list every reason</text>
<path class="l" d="M410,570V608" marker-end="url(#a)"/>
<text x="424" y="594" class="lab" style="text-anchor:start">No</text>
<polygon class="d" points="410,608 525,656 410,704 295,656"/><text x="410" y="660.0" class="c">marks ≥ 90 ?</text>
<path class="l" d="M295,656H220" marker-end="url(#a)"/>
<text x="258" y="646" class="lab" style="text-anchor:middle">Yes</text>
<rect class="ok" x="40" y="624" width="180" height="64" rx="8"/><text x="130.0" y="649.5" class="c b">FULL SCHOLARSHIP</text><text x="130.0" y="670.5" class="c">marks 90% or above</text>
<path class="l" d="M525,656H600" marker-end="url(#a)"/>
<text x="562" y="646" class="lab" style="text-anchor:middle">No</text>
<rect class="wa" x="600" y="624" width="180" height="64" rx="8"/><text x="690.0" y="649.5" class="c b">PARTIAL SCHOLARSHIP</text><text x="690.0" y="670.5" class="c">marks 80% to 89%</text>
<path class="l" d="M130,688V792H250" marker-end="url(#a)"/>
<path class="l" d="M690,688V778H570" marker-end="url(#a)"/>
<path class="l" d="M780,522H806V806H570" marker-end="url(#a)"/>
<rect class="n" x="250" y="762" width="320" height="60" rx="8"/><text x="410.0" y="785.5" class="c b">Print evaluation report</text><text x="410.0" y="806.5" class="c">student details, status, result, reasons</text>
<path class="l" d="M410,822V848" marker-end="url(#a)"/>
<rect class="tm" x="330" y="848" width="160" height="38" rx="19"/><text x="410.0" y="872" class="c b" style="fill:#fff">END</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
