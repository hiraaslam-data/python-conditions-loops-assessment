<text x="430" y="40" class="c t">Python Conditions &amp; Loops Assessment</text>
<text x="430" y="62" class="c s">Two console applications · one per topic · built in Python 3</text>
<rect x="30" y="86" width="385" height="300" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
