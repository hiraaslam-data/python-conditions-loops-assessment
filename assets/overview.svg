<text x="46" y="116" class="b" style="fill:#fff;font-size:15px">Task 1 · Student Scholarship Eligibility</text>
<text x="46" y="150" class="m" style="font-size:13px">student_scholarship_system.py</text>
<text x="46" y="176" class="b">Topic: Conditional statements</text>
<text x="46" y="206" class="s">Input: name, marks, attendance, income</text>
<text x="46" y="230" class="s">Rules: marks ≥ 80 · attendance ≥ 85 · income ≤ 50,000</text>
<text x="46" y="254" class="s">Output: Full / Partial / Not Eligible + reasons</text>
<text x="46" y="288" class="lab">CONCEPTS USED</text>
<rect x="46" y="298" width="36.4" height="24" rx="12" fill="#ddf4ff" stroke="#0969da"/><text x="64.2" y="314" class="c m">if</text><rect x="90.4" y="298" width="50.8" height="24" rx="12" fill="#ddf4ff" stroke="#0969da"/><text x="115.80000000000001" y="314" class="c m">elif</text><rect x="149.2" y="298" width="50.8" height="24" rx="12" fill="#ddf4ff" stroke="#0969da"/><text x="174.6" y="314" class="c m">else</text><rect x="208.0" y="298" width="108.4" height="24" rx="12" fill="#ddf4ff" stroke="#0969da"/><text x="262.2" y="314" class="c m">try / except</text><rect x="46" y="330" width="94.0" height="24" rx="12" fill="#ddf4ff" stroke="#0969da"/><text x="93.0" y="346" class="c m">while True</text><rect x="148.0" y="330" width="86.8" height="24" rx="12" fill="#ddf4ff" stroke="#0969da"/><text x="191.4" y="346" class="c m">functions</text><rect x="242.8" y="330" width="86.8" height="24" rx="12" fill="#ddf4ff" stroke="#0969da"/><text x="286.2" y="346" class="c m">f-strings</text>
<rect x="445" y="86" width="385" height="300" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<path d="M445,96a10,10 0 0 1 10,-10h365a10,10 0 0 1 10,10v38h-385z" fill="#1a7f37"/>
<text x="461" y="116" class="b" style="fill:#fff;font-size:15px">Task 2 · Pharmacy Inventory &amp; Sales</text>
<text x="461" y="150" class="m" style="font-size:13px">pharmacy_inventory_system.py</text>
<text x="461" y="176" class="b">Topic: Loop structures</text>
<text x="461" y="206" class="s">Input: n medicines, then stock, price, quantity sold</text>
<text x="461" y="230" class="s">Checks: stock available · low stock below 10 units</text>
<text x="461" y="254" class="s">Output: revenue, restock count, final report</text>
<text x="461" y="288" class="lab">CONCEPTS USED</text>
<rect x="461" y="298" width="43.6" height="24" rx="12" fill="#dafbe1" stroke="#1a7f37"/><text x="482.8" y="314" class="c m">for</text><rect x="512.6" y="298" width="72.4" height="24" rx="12" fill="#dafbe1" stroke="#1a7f37"/><text x="548.8000000000001" y="314" class="c m">range()</text><rect x="593.0" y="298" width="72.4" height="24" rx="12" fill="#dafbe1" stroke="#1a7f37"/><text x="629.2" y="314" class="c m">counter</text><rect x="673.4" y="298" width="101.2" height="24" rx="12" fill="#dafbe1" stroke="#1a7f37"/><text x="724.0" y="314" class="c m">accumulator</text><rect x="461" y="330" width="94.0" height="24" rx="12" fill="#dafbe1" stroke="#1a7f37"/><text x="508.0" y="346" class="c m">if in loop</text><rect x="563.0" y="330" width="108.4" height="24" rx="12" fill="#dafbe1" stroke="#1a7f37"/><text x="617.2" y="346" class="c m">try / except</text><rect x="679.4" y="330" width="86.8" height="24" rx="12" fill="#dafbe1" stroke="#1a7f37"/><text x="722.8" y="346" class="c m">functions</text>
